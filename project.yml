name: Aurora
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
    resources:
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Attach a photo for fully offline text recognition and optional on-device visual assistance."
        NSCameraUsageDescription: "Take a photo for fully offline text recognition and optional on-device visual assistance."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Aurora
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  AuroraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Aurora
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AuroraTests
schemes:
  Aurora:
    build:
      targets:
        Aurora: all
        AuroraTests: [test]
    test:
      targets:
        - AuroraTests
