name: TrailGuard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  TrailGuard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
    resources:
      - path: Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrailGuard
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Attach a photo for fully offline text recognition and optional on-device visual assistance."
        NSCameraUsageDescription: "Take a photo for fully offline text recognition and optional on-device visual assistance."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrailGuard
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
  TrailGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
    resources:
      - path: Tests/Fixtures
    dependencies:
      - target: TrailGuard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrailGuardTests
schemes:
  TrailGuard:
    build:
      targets:
        TrailGuard: all
        TrailGuardTests: [test]
    test:
      targets:
        - TrailGuardTests
