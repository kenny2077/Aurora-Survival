name: Aurora
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    AURORA_PACKAGE_CATALOG_URL: ""
    AURORA_CAMERA_USAGE_DESCRIPTION: "Take a photo for fully offline visual assistance."
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.26.0
  AuroraLlamaRuntime:
    path: Runtime/AuroraLlamaRuntime
  AuroraSpeciesKit:
    url: https://github.com/kenny2077/aurora-species-BioCLIP
    exactVersion: 0.1.1
targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Resources
        excludes:
          - ExpertVectors
          - Knowledge/CorpusSources
          - Knowledge/expert_corpus_v3.json
          - Knowledge/expert_shadow_corpus.json
          - Knowledge/expert_user_language.json
          - Knowledge/legacy_anchor_manifest.json
          - Knowledge/survival_fallback.json
          - Knowledge/survival_knowledge.sha256
          - Knowledge/survival_knowledge.sqlite
          - Knowledge/survival_knowledge_source.json
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        CFBundleName: Aurora Offline AI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Choose an existing photo or save a photo you take before attaching it for fully offline visual assistance."
        NSCameraUsageDescription: "$(AURORA_CAMERA_USAGE_DESCRIPTION)"
        NSBluetoothAlwaysUsageDescription: "Find nearby Aurora Mesh Chat group members while the Debug beta is visibly open."
        NSLocalNetworkUsageDescription: "Connect to your trusted Aurora package host to download signed offline models, guides, and maps during preparation."
        AuroraPackageCatalogURL: "$(AURORA_PACKAGE_CATALOG_URL)"
        NSLocationWhenInUseUsageDescription: "Show your position and record an explicitly started breadcrumb trail, including while the screen is locked."
        NSMicrophoneUsageDescription: "Record an optional voice note for a survival waypoint and keep it on this device."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AuroraSurvivalAgent
        DEVELOPMENT_TEAM: AL8BCFV85N
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG AURORA_MESH_BETA"
          AURORA_CAMERA_USAGE_DESCRIPTION: "Take a photo for offline visual assistance or scan an in-person Aurora Mesh Chat invite."
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: development_trusted_package_keys.json
    dependencies:
      - package: MapLibre
      - package: AuroraLlamaRuntime
      - package: AuroraSpeciesKit
  AuroraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Aurora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AuroraSurvivalAgentTests
        DEVELOPMENT_TEAM: AL8BCFV85N
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG AURORA_MESH_BETA"
  AuroraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Aurora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AuroraSurvivalAgentUITests
        DEVELOPMENT_TEAM: AL8BCFV85N
      configs:
        Debug:
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) DEBUG AURORA_MESH_BETA"
schemes:
  Aurora:
    build:
      targets:
        Aurora: all
        AuroraTests: [test]
    test:
      targets:
        - AuroraTests
        - AuroraUITests
