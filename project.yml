name: TrailGuard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
packages:
  TrailGuardLlamaRuntime:
    path: Runtime/TrailGuardLlamaRuntime
targets:
  TrailGuard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrailGuard
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Attach a photo for fully offline text recognition and optional on-device visual assistance."
        NSCameraUsageDescription: "Take a photo for fully offline text recognition and optional on-device visual assistance."
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrailGuard
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: development_trusted_package_keys.json
    dependencies:
      - package: TrailGuardLlamaRuntime
  TrailGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: TrailGuard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrailGuardTests
schemes:
  TrailGuard:
    build:
      targets:
        TrailGuard: all
        TrailGuardTests: [test]
    test:
      targets:
        - TrailGuardTests
