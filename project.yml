name: TrailGuard
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.26.0
  TrailGuardLlamaRuntime:
    path: Runtime/TrailGuardLlamaRuntime
targets:
  TrailGuard:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Resources
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TrailGuard
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Attach a photo for fully offline text recognition and optional on-device visual assistance."
        NSCameraUsageDescription: "Take a photo for fully offline text recognition and optional on-device visual assistance."
        NSLocalNetworkUsageDescription: "Connect to your trusted TrailGuard package host to download signed offline models, guides, and maps during preparation."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrailGuard
        DEVELOPMENT_TEAM: AL8BCFV85N
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: development_trusted_package_keys.json
    dependencies:
      - package: MapLibre
      - package: TrailGuardLlamaRuntime
  TrailGuardTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: TrailGuard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrailGuardTests
        DEVELOPMENT_TEAM: AL8BCFV85N
  TrailGuardUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: TrailGuard
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TrailGuardUITests
        DEVELOPMENT_TEAM: AL8BCFV85N
schemes:
  TrailGuard:
    build:
      targets:
        TrailGuard: all
        TrailGuardTests: [test]
    test:
      targets:
        - TrailGuardTests
        - TrailGuardUITests
