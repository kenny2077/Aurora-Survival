name: Aurora
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.26.0
  AuroraLlamaRuntime:
    path: Runtime/AuroraLlamaRuntime
targets:
  Aurora:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Core
      - path: Resources
        excludes:
          - ExpertVectors
        buildPhase: resources
      - path: Resources/ExpertVectors
        type: folder
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Aurora
        CFBundleName: Aurora Offline AI
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        NSPhotoLibraryUsageDescription: "Choose an existing photo or save a photo you take before attaching it for fully offline visual assistance."
        NSCameraUsageDescription: "Take a photo, save it to your Photo Library, and attach it for fully offline visual assistance."
        NSLocalNetworkUsageDescription: "Connect to your trusted Aurora package host to download signed offline models, guides, and maps during preparation."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Aurora
        DEVELOPMENT_TEAM: AL8BCFV85N
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      configs:
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: development_trusted_package_keys.json
    dependencies:
      - package: MapLibre
      - package: AuroraLlamaRuntime
  AuroraTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
        excludes:
          - Fixtures
      - path: Tests/Fixtures
        buildPhase: resources
    dependencies:
      - target: Aurora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AuroraTests
        DEVELOPMENT_TEAM: AL8BCFV85N
  AuroraUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Aurora
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AuroraUITests
        DEVELOPMENT_TEAM: AL8BCFV85N
schemes:
  Aurora:
    build:
      targets:
        Aurora: all
        AuroraTests: [test]
    test:
      targets:
        - AuroraTests
        - AuroraUITests
