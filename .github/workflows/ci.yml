name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Regenerate deterministic fixtures
        run: |
          python3 tools/generate_evaluation_fixtures.py
          python3 tools/generate_emergency_core.py
      - name: Verify generated files are current
        run: git diff --exit-code
      - name: Validate packs and safety contracts
        run: python3 tools/validate.py
      - name: Verify reproducible signed pack build
        run: python3 tools/test_pack_reproducibility.py

  swift-core:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Test core package
        run: python3 tools/run_swift_tests.py

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app
        run: >
          xcodebuild
          -project Aurora.xcodeproj
          -scheme Aurora
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
