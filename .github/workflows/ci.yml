name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python3 -m pip install -r requirements-dev.txt
      - name: Validate packs and Lite Chat contracts
        run: python3 tools/validate.py
      - name: Verify reproducible signed pack build
        run: python3 tools/test_pack_reproducibility.py
      - name: Verify species packaging and public download checks
        run: |
          python3 tools/test_download_domain.py
          python3 tools/test_species_packaging.py
          python3 tools/test_species_release.py
          python3 tools/test_r2_model_release.py

  swift-core:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test Swift test runner
        run: python3 tools/test_run_swift_tests.py
      - name: Test core package
        run: python3 tools/run_swift_tests.py

  ios-build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build iOS app
        run: >
          xcodebuild
          -project Aurora.xcodeproj
          -scheme Aurora
          -sdk iphonesimulator
          -destination 'generic/platform=iOS Simulator'
          CODE_SIGNING_ALLOWED=NO
          build
